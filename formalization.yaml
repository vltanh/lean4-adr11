version: "v0.4"

project:
  name: "Identifying the rooted species tree from unrooted gene trees under the coalescent"
  description: >-
    A formalization of E. S. Allman, J. H. Degnan and J. A. Rhodes, "Identifying the rooted
    species tree from the distribution of unrooted gene trees under the coalescent", J. Math.
    Biol. 62 (2011) 833-862. The multispecies coalescent is defined from Kingman's coalescent on
    forests of gene lineages (its generator, the matrix exponential, and a recursion over the
    species tree).


    Proved: the distribution of unrooted topological gene trees, with one lineage sampled per
    taxon, determines the rooted species tree and its internal branch lengths when there are at
    least five taxa (Theorem 9); on four taxa it determines exactly the unrooted metric species
    tree (Proposition 3); with several lineages per taxon it also determines the corresponding
    pendant branch lengths (Corollary 10); and all of this holds for nonbinary species trees
    (Proposition 11). Every other result of the paper is proved too, with the explicit gene tree
    distributions, linear invariants and inequalities for five taxa, and the cited results that
    the proofs use: Tavare's formula, the reconstruction of trees from quartets, and Cayley's
    count of tree shapes.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

