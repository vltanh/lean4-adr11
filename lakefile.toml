name = "ADR11"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ADR11", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "ADR11"
globs = ["ADR11.+"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
